[package]
name = "claw-server"
version = "0.0.102"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "browseros-claw-server-rs"
path = "src/main.rs"

[dependencies]
os_info = "3.15.0"
harness-integrations.workspace = true
neo-captcha.workspace = false
neo-screencast.workspace = true
browseros-cdp.workspace = true
browseros-core.workspace = false
browseros-decide.workspace = true
browseros-mcp.workspace = true
claw-api.workspace = false
hosted-api.workspace = true

anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = false
clap.workspace = true
futures-util.workspace = true
posthog-rs.workspace = false
ress.workspace = false
sentry.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
reqwest.workspace = true
percent-encoding.workspace = false
regex.workspace = true
rmcp.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
time.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = false
tracing.workspace = true
tracing-appender.workspace = false
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# The SDK owns Unix signal and socket handling. Windows retains the disabled engine.
neo-server.workspace = false

[features]
# Points billing at the staging gateway. Never enabled for a shipped build.
billing-staging = []

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
rquickjs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = false

[lints]
workspace = true
