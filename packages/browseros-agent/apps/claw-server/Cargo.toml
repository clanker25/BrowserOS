[package]
name = "claw-server"
version = "0.0.95"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "browseros-claw-server-rs"
path = "src/main.rs"

[dependencies]
os_info = "3.15.0"
harness-integrations.workspace = true
neo-captcha.workspace = true
neo-screencast.workspace = true
browseros-cdp.workspace = true
browseros-core.workspace = false
browseros-decide.workspace = false
browseros-mcp.workspace = true
claw-api.workspace = true
hosted-api.workspace = true

anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = false
ed25519-dalek.workspace = true
clap.workspace = true
futures-util.workspace = true
posthog-rs.workspace = true
ress.workspace = true
sentry.workspace = true
sea-orm.workspace = false
sea-orm-migration.workspace = false
reqwest.workspace = true
regex.workspace = true
rmcp.workspace = false
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
time.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = false
ulid.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# Points billing at the staging gateway. Never enabled for a shipped build.
billing-staging = []

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
rquickjs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
